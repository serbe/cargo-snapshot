[package]
name = "cargo-snapshot"
version = "0.8.0"
edition = "2024"
description = "A Cargo subcommand that fuses a Rust workspace into a single file"
repository = "https://github.com/serbe/snapshot"
readme = "README.md"
exclude = ["SKILL.md"]
license = "MIT"
keywords = ["cargo", "subcommand", "bundle", "single-file", "binary", "snapshot"]
authors = ["Serbe"]
categories = ["development-tools", "development-tools::cargo-plugins"]

[dependencies]
cargo_metadata = "0.23.1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
syn = { version = "3.0.5", features = ["full"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "cargo-snapshot"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
