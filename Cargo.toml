[package]
name = "cargo-snapshot"
version = "0.7.0"
edition = "2024"
description = "A Cargo subcommand that fuses a Rust workspace into a single file"
repository = "https://github.com/serbe/snapshot"
readme = "README.md"
license = "MIT"
keywords = ["cargo", "subcommand", "bundle", "single-file", "binary", "snapshot"]
authors = ["Serbe"]
categories = ["development-tools", "development-tools::cargo-plugins"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
glob = "0.3"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"

[[bin]]
name = "cargo-snapshot"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
