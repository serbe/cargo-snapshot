# clippy.toml — настройки параметров линтов.
# Этот файл НЕ включает/отключает сами линты (это делается через флаги
# или #[allow]/#[deny]), а задаёт числовые и строковые пороги для тех
# линтов, которые уже включены.
#
# Расположение: корень воркспейса рядом с Cargo.toml.

# Максимальная когнитивная сложность функции.
# Дефолт: 25. Значение 15 уже строго, но реалистично.
cognitive-complexity-threshold = 15

# Максимальное число строк в функции. Дефолт: 100.
# Заставляет дробить большие функции.
too-many-lines-threshold = 60

# Максимальное число аргументов функции. Дефолт: 7.
too-many-arguments-threshold = 6

# Максимальная глубина вложенности. Дефолт: 5.
max-fn-params-bools = 3

# Минимальная длина имени переменной, которую clippy считает «слишком короткой».
# Дефолт: 1 (т.е. запрещены только однобуквенные имена за исключением общепринятых).
# 2 — чуть строже: запрещает `io`, `ok`, `db` и т.п. без контекста.
# Оставим дефолт 1, чтобы не конфликтовать с устоявшимися идиомами (i, j, e, f, x).
single-char-binding-names-threshold = 4

# Пороговый размер типа (байт), при превышении которого clippy
# рекомендует передавать по ссылке вместо копирования.
# Дефолт: 128. Значение 64 строже: предупреждает о копировании String/Vec-like обёрток.
trivial-copy-size-limit = 64

# Пороговый размер для clippy::large_stack_arrays.
# Дефолт: 512 000 байт (512 КБ). Уменьшаем до разумного.
array-size-threshold = 16_384

# Пороговый размер для clippy::large_const_arrays.
max-suggested-slice-pattern-length = 4

# Не считать Vec<T> «слишком большим значением» если T мелкий.
# (Влияет на clippy::large_types_passed_by_value.)
# Дефолт: отсутствует; просто держим осознанно в голове.

max-struct-bools = 6