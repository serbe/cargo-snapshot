# .cargo/config.toml — флаги clippy, применяемые автоматически при `cargo clippy`.
#
# Расположение: .cargo/config.toml в корне воркспейса.
#
# Альтернатива: прописать те же флаги в CI через:
#   cargo clippy --all-targets --all-features -- <флаги>

[alias]
# Короткая команда для локальной проверки:
#   cargo lint
lint = "clippy --all-targets --all-features --"

[target.'cfg(all())']
# Флаги, передаваемые компилятору через clippy для ВСЕХ таргетов.
# Список применяется в порядке: сначала группы (W/D), потом точечные override'ы (A).
rustflags = [
    # ── 1. Стандартные rustc линты ──────────────────────────────────────────────
    #
    # Превращаем предупреждения rustc в ошибки в CI.
    # Локально можно оставить -W чтобы не блокировать сборку.
    "-Wunused",
    "-Wdead-code",
    "-Wunreachable-pub",          # pub-элементы, недостижимые снаружи крейта
    # "-Wmissing-docs",           # нет doc-комментариев на pub-API
    "-Wrust-2018-idioms",         # устаревшие идиомы pre-2018
    "-Wtrivial-casts",
    "-Wtrivial-numeric-casts",
    "-Wunused-lifetimes",
    "-Wunused-qualifications",

    # ── 2. clippy::correctness (включена по умолчанию, дублируем явно) ──────────
    #
    # Ошибки — вещи, которые почти всегда баг.
    # Включена по умолчанию, но полезно зафиксировать через -D.
    "-Dclippy::correctness",

    # ── 3. clippy::suspicious ───────────────────────────────────────────────────
    #
    # Подозрительный, но не всегда неверный код.
    "-Wclippy::suspicious",

    # ── 4. clippy::complexity ────────────────────────────────────────────────────
    #
    # Излишне сложные конструкции с более простым эквивалентом.
    "-Wclippy::complexity",

    # ── 5. clippy::perf ──────────────────────────────────────────────────────────
    #
    # Производительностные антипаттерны: лишние аллокации, клоны, collect и т.д.
    "-Wclippy::perf",

    # ── 6. clippy::style ─────────────────────────────────────────────────────────
    #
    # Стилевые предпочтения Rust-сообщества.
    "-Wclippy::style",

    # ── 7. clippy::pedantic — строгий набор ──────────────────────────────────────
    #
    # Включаем группу целиком, затем точечно отключаем линты,
    # которые создают ложные срабатывания или неоправданный шум.
    "-Wclippy::pedantic",

    # Отключаем шумные педантичные линты:
    #
    # missing_errors_doc / missing_panics_doc — полезны для публичных библиотек,
    # но создают огромный шум в бинарниках и internal-API.
    "-Aclippy::missing_errors_doc",
    "-Aclippy::missing_panics_doc",

    # module_name_repetitions — запрещает `config::Config`, `error::Error` и т.д.,
    # но это устоявшийся идиоматичный паттерн Rust.
    "-Aclippy::module_name_repetitions",

    # wildcard_imports — запрет `use foo::*` оправдан в библиотеках,
    # но мешает в тестах (`use super::*`) и в prelude-паттернах.
    # Отключаем глобально, оставляя на усмотрение ревьюера.
    "-Aclippy::wildcard_imports",

    # must_use_candidate — требует #[must_use] на всех fn, возвращающих значение.
    # Слишком агрессивно для не-библиотечного кода.
    "-Aclippy::must_use_candidate",

    # ── 8. Точечные включения из clippy::restriction ─────────────────────────────
    #
    # clippy::restriction — группа с намеренно несовместимыми линтами;
    # её НЕ включают целиком, только отдельные линты по смыслу.
    #
    # Запрет dbg!() в коде (забытый дебаг).
    "-Wclippy::dbg_macro",

    # Запрет todo!() и unimplemented!() — должны быть либо убраны, либо
    # заменены на #[allow] с комментарием.
    "-Wclippy::todo",
    "-Wclippy::unimplemented",

    # Запрет unwrap() в не-тестовом коде — используйте expect() с сообщением
    # или нормальную обработку ошибок.
    "-Wclippy::unwrap_used",

    # expect() разрешён, но должен сопровождаться осмысленным сообщением.
    # (Сам линт не проверяет текст, но дисциплинирует.)
    # "-Wclippy::expect_used",   # раскомментируйте для максимальной строгости

    # Запрет println!/eprintln! вне main/bin — в библиотеках нужен tracing/log.
    # Для бинарников оставьте закомментированным.
    # "-Wclippy::print_stdout",
    # "-Wclippy::print_stderr",

    # Запрет panic!() вне тестов.
    "-Wclippy::panic",

    # Запрет индексирования slice[i] без проверки границ — используйте .get(i).
    # Строго, но оправдано в системном коде.
    # "-Wclippy::indexing_slicing",  # очень строго, включайте осознанно

    # Требует #[allow(reason = "...")] — каждый `allow` должен быть обоснован.
    # Доступен с Rust 1.68 через clippy::allow_attributes_without_reason
    # (но до stable добрался только частично — проверьте версию).
    "-Wclippy::allow_attributes_without_reason",

    # ── 9. clippy::nursery — экспериментальный, необязательный ──────────────────
    #
    # Линты в активной разработке; могут давать false positive.
    # Рекомендуется включать только локально для исследования, не в CI.
    # "-Wclippy::nursery",
    # "-Aclippy::redundant_pub_crate",   # если nursery включён — шумит на pub(crate)
]